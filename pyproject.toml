[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanwise"
version = "0.1.0"
description = "Predicting the value of data-cleaning interventions with meta-learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "joblib>=1.3",
  "streamlit>=1.32",
  "matplotlib>=3.7",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.3"]
tracking = ["mlflow>=2.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
